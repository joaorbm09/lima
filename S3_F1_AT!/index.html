<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresa XPTO</title>
</head>
<body>
    <!--Aqui estamos definindo nosso "Heading" ou seja nosso cabeçalho, que nesse caso é o cabeçalho principal-->
    <h1>XPTO a Empresa de negocios</h1>
    <!--Aqui estamos definindo nossa descrição(Flow - Exibindo parágrafos de texto)-->
    <p>Aqui ajudaremos você a construir grandes e pequenos negocios</p>
    <!-- Já aqui definimos a nossa logo de destque da empresa(Embedded - Exibindo imagens na pagina)-->
    <img src="carro.png" alt="Imagem falhou!" width="30%" height="30%"> 
    <!--quebra de linha-->
    <br>
    <!--Aqui estmos fazendo uma conexão ebntre as abas quando o usuario clicar no link, ele ira ser direcionado para outra aba(Interactive - Criamos um hiperlink de navegação)-->
    <a href="./index1.html">Clique aqui para entrar em contato com nosso atendimento</a>
    <!--Aqui estamos usando tanto o "button", como estamos também utilizando o "a". O "a" estamos definindo qual hiperlink estaremos sendo direcionados, já o "button" é um botão clicavel para realizar ações /interações-->
    <a href="./index2.html">
        <button type="button">Fale Conosco</button>
    </a>
</body>
</html>
