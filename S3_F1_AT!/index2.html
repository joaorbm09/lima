<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HighTech Fale Conosco</title><!-- definindo o titulo da pagina-->
</head>
<body>
    <header><!--Aqui estamos separando o cabeçalho principal-->
        <h1> Aqui é a nossa aba de acessibilidade ou reclamações. </h1><!--cabeçalho pricipal ou no caso titulo da pagina-->
    </header>
    <main> <!-- aqui estamos agrupando a parte princpal do codigo-->
        <section> <!-- aqui estamos definindo uma seção, se utilizarmos este padrao de semântica não precisamos utilizar o br para quebrar linhas todas as horas-->
            <div> <!--estou separando as partes do codigo em blocos para ficar mais facil de compreender e organizar o codigo-->
                <p> Deixe sua mensagem! </p><!-- breve descrição em linha de paragrafo-->
                <input type="Escreva aqui!!"><!-- campo de mensagem para o usuario poder escrever"claramente só exemplificação, pois a mensagem não vai para lugar nenhum-->
                <button type="button">Enviar</button><!--botã de envio para o input, mas não é funcional-->
            </div>
            <div>
                <a href="./index.html"><!-- aqui estou definindo um destino para o meu botão, ou seja quando este botão for clicado, a pagina retornará para a paginá principal-->
                    <button type="button">Voltar</button>
                    </a>
            </div>
        </section>
    </main>
</body>
</html>
